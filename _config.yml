# ============================================================
#  Site settings. Placeholders — replace with yours.
#  If you run a local preview, restart it after editing this file.
# ============================================================

title: Site Title
tagline: Lorem Ipsum Dolor
description: >-
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
  eiusmod tempor incididunt ut labore et dolore magna aliqua.

email: placeholder@gmail.com

# Full site address. Needed so the RSS feed and social preview tags emit
# absolute links. baseurl stays empty for a username.github.io site.
url: "https://corturn.github.io"
baseurl: ""


# ============================================================
#  Navigation — drives the menu on every page.
# ============================================================

nav:
  - title: Tutoring
    url: /tutoring/
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: Inquire
    url: /contact/


# ============================================================
#  Build settings
# ============================================================

plugins:
  - jekyll-feed      # generates /feed.xml
  - jekyll-seo-tag   # generates page titles / social preview tags

# /blog/my-post/ instead of /blog/2026/08/15/my-post.html
permalink: /blog/:title/

# Every post gets the "post" layout automatically.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
