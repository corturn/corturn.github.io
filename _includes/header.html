<header class="site-header">

  <a class="brand" href="{{ '/' | relative_url }}">
    {%- comment -%}
      To add a painted logo, put the file at assets/images/logo.png and
      uncomment the line below. It's styled by .brand__mark in style.css.

      <img class="brand__mark" src="{{ '/assets/images/logo.png' | relative_url }}" alt="">
    {%- endcomment -%}
    <span class="brand__text">
      <span class="brand__name">{{ site.title }}</span>
      <span class="brand__tagline">{{ site.tagline }}</span>
    </span>
  </a>

  <nav class="site-nav" aria-label="Main">
    {%- for item in site.nav -%}
      <a class="nav-{{ item.title | slugify }}" href="{{ item.url | relative_url }}"
         {% if page.url contains item.url and item.url != '/' %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor -%}
  </nav>

</header>
